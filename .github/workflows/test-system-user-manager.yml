name: Test SSH system-user discovery

on:
  pull_request:
    paths:
      - "systemUserManager.py"
      - "helper.py"
      - "__init__.py"
      - "tests/test_system_user_shell.py"
      - ".github/workflows/test-system-user-manager.yml"
  push:
    branches:
      - main
    paths:
      - "systemUserManager.py"
      - "helper.py"
      - "__init__.py"
      - "tests/test_system_user_shell.py"
      - ".github/workflows/test-system-user-manager.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check psutil python-dateutil json5 bcrypt
      - name: Prepare library import layout
        run: |
          mkdir -p /tmp/jblibs-test/libs
          ln -s "$GITHUB_WORKSPACE" /tmp/jblibs-test/libs/JBLibs
          mkdir -p log
      - name: Compile source and tests
        run: PYTHONPATH=/tmp/jblibs-test python -m py_compile systemUserManager.py tests/test_system_user_shell.py
      - name: Run SSH system-user tests
        run: PYTHONPATH=/tmp/jblibs-test python -m unittest -v tests.test_system_user_shell
