name: Test c_menu interrupt handling

on:
  pull_request:
    paths:
      - "c_menu.py"
      - "c_menu.md"
      - "__init__.py"
      - "tests/test_c_menu_interrupt.py"
      - ".github/workflows/test-c-menu-interrupt.yml"
  push:
    branches:
      - main
    paths:
      - "c_menu.py"
      - "c_menu.md"
      - "__init__.py"
      - "tests/test_c_menu_interrupt.py"
      - ".github/workflows/test-c-menu-interrupt.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependency
        run: python -m pip install psutil==6.1.0

      - name: Prepare JBLibs log directory
        run: |
          sudo mkdir -p /var/log/jb_sys_apps
          sudo chown "$(id -u):$(id -g)" /var/log/jb_sys_apps

      - name: Compile menu modules
        run: python -m py_compile c_menu.py term.py tests/test_c_menu_interrupt.py

      - name: Run c_menu interrupt tests
        run: python -m unittest discover -s tests -p "test_c_menu_interrupt.py" -v
