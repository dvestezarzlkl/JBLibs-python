name: Test terminal menu/input interaction

on:
  pull_request:
    paths:
      - "c_menu.py"
      - "c_menu.md"
      - "input.py"
      - "term.py"
      - "lng/default.py"
      - "lng/cs-CZ.py"
      - "__init__.py"
      - "Readme.md"
      - "AGENTS.md"
      - "tests/test_c_menu_interrupt.py"
      - "tests/test_choice_processing.py"
      - ".github/workflows/test-c-menu-interrupt.yml"
  push:
    branches:
      - main
    paths:
      - "c_menu.py"
      - "c_menu.md"
      - "input.py"
      - "term.py"
      - "lng/default.py"
      - "lng/cs-CZ.py"
      - "__init__.py"
      - "Readme.md"
      - "AGENTS.md"
      - "tests/test_c_menu_interrupt.py"
      - "tests/test_choice_processing.py"
      - ".github/workflows/test-c-menu-interrupt.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install psutil==6.1.0 bcrypt

      - name: Prepare JBLibs log directory
        run: mkdir -p log

      - name: Compile terminal interaction modules
        run: python -m py_compile c_menu.py input.py term.py tests/test_c_menu_interrupt.py tests/test_choice_processing.py

      - name: Run terminal interaction tests
        run: python -m unittest tests.test_c_menu_interrupt tests.test_choice_processing -v
