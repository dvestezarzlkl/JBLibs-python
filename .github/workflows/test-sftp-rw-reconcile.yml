name: Test SFTP RO-RW reconciliation

on:
  pull_request:
    paths:
      - "sftp/**"
      - "__init__.py"
      - "tests/test_sftp_rw_reconcile.py"
      - ".github/workflows/test-sftp-rw-reconcile.yml"
  push:
    branches:
      - main
    paths:
      - "sftp/**"
      - "__init__.py"
      - "tests/test_sftp_rw_reconcile.py"
      - ".github/workflows/test-sftp-rw-reconcile.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check psutil python-dateutil
      - name: Prepare package layout
        run: |
          mkdir -p /tmp/jblibs-test/libs
          ln -s "$GITHUB_WORKSPACE" /tmp/jblibs-test/libs/JBLibs
          mkdir -p log
      - name: Compile
        run: PYTHONPATH=/tmp/jblibs-test python -m py_compile sftp/parser.py sftp/sambaPoint.py tests/test_sftp_rw_reconcile.py
      - name: Run tests
        run: PYTHONPATH=/tmp/jblibs-test python -m unittest -v tests.test_sftp_rw_reconcile
      - name: Verify version
        run: python -c 'import re,pathlib; v=re.search(r"^__version__ = \"([^\"]+)\"", pathlib.Path("__init__.py").read_text(), re.M).group(1); assert v == "1.2.20"'
