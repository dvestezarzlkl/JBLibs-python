name: Test mail transport

on:
  pull_request:
    paths:
      - "mail.py"
      - "tests/test_mail.py"
      - ".github/workflows/test-mail.yml"
  push:
    branches:
      - main
    paths:
      - "mail.py"
      - "tests/test_mail.py"
      - ".github/workflows/test-mail.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile mail transport
        run: python -m py_compile mail.py

      - name: Run mail tests
        run: python -m unittest discover -s tests -p "test_mail.py" -v
